<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>ui dev — 燼原戰線 Cinder Front</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; overscroll-behavior: none; }
      body { font-family: -apple-system, 'PingFang TC', 'Helvetica Neue', sans-serif; color: #e8e6e1; -webkit-user-select: none; user-select: none; }
      #app { position: fixed; inset: 0; }
      #dev-badge { position: fixed; left: 50%; bottom: 2px; transform: translateX(-50%); z-index: 1000; pointer-events: none; white-space: nowrap;
        font: 10px/1.4 ui-monospace, Menlo, monospace; color: rgba(255, 255, 255, 0.42); text-shadow: 0 1px 2px #000; }
      #dev-err { position: fixed; left: 8px; bottom: 20px; z-index: 1001; max-width: 70vw; max-height: 40vh; overflow: auto; margin: 0; padding: 8px 10px;
        background: rgba(70, 10, 12, 0.94); border: 1px solid #e5484d; border-radius: 6px; color: #ffd7d7;
        font: 11px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="dev-badge"></div>
    <pre id="dev-err" hidden></pre>
    <script type="module" src="/src/ui/dev.ts"></script>
  </body>
</html>
