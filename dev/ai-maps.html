<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ai-maps dev — 燼原戰線</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0b0d10; color: #e8e6e1; font: 13px/1.45 -apple-system, 'PingFang TC', 'Helvetica Neue', sans-serif; }
      header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 14px; background: #14181d; border-bottom: 1px solid #262c34; position: sticky; top: 0; z-index: 2; }
      header h1 { font-size: 14px; margin: 0 8px 0 0; letter-spacing: .12em; font-weight: 600; }
      label { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
      select, input, button { background: #1d232b; color: inherit; border: 1px solid #343c47; border-radius: 4px; padding: 4px 8px; font: inherit; }
      input[type='number'] { width: 90px; }
      button { cursor: pointer; }
      button:hover { background: #28303a; }
      main { display: flex; flex-wrap: wrap; gap: 16px; padding: 14px; align-items: flex-start; }
      canvas { image-rendering: pixelated; background: #000; border: 1px solid #262c34; max-width: 100%; }
      #side { flex: 1 1 280px; min-width: 260px; max-width: 460px; }
      #side h2 { font-size: 13px; margin: 12px 0 4px; color: #9fb3c8; font-weight: 600; }
      table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
      td, th { padding: 2px 8px 2px 0; text-align: left; border-bottom: 1px solid #1d232b; }
      .sw { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; border: 1px solid #0006; }
      .bad { color: #ff6b6b; } .ok { color: #7bd88f; }
      #gallery { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 14px 20px; }
      #gallery figure { margin: 0; cursor: pointer; }
      #gallery figcaption { text-align: center; padding-top: 4px; color: #9fb3c8; }
      pre { white-space: pre-wrap; margin: 4px 0; font: 12px/1.4 ui-monospace, Menlo, monospace; }
    </style>
  </head>
  <body>
    <header>
      <h1>地圖 / AI 檢視器</h1>
      <label>地圖 <select id="map"></select></label>
      <label>種子 <input id="seed" type="number" value="1" /></label>
      <button id="prev">◀</button><button id="next">▶</button>
      <label>疊圖 <select id="overlay">
        <option value="none">無</option>
        <option value="reach">可達範圍</option>
        <option value="wide">寬通道 (≥3)</option>
        <option value="blocked">不可達的可通行地</option>
      </select></label>
      <label>倍率 <select id="zoom"><option>4</option><option selected>6</option><option>8</option></select></label>
      <span id="simbar"></span>
    </header>
    <main>
      <canvas id="view"></canvas>
      <div id="side"></div>
    </main>
    <div id="gallery"></div>
    <script type="module" src="/src/maps/dev.ts"></script>
  </body>
</html>
